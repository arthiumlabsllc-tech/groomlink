version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: groomlink-postgres
    environment:
      POSTGRES_USER: groomlink
      POSTGRES_PASSWORD: groomlink123
      POSTGRES_DB: groomlink
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groomlink -d groomlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: groomlink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: groomlink-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://groomlink:groomlink123@postgres:5432/groomlink
      REDIS_URL: redis://redis:6379
      JWT_SECRET: groomlink-dev-secret-key-change-in-production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./services/api/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

volumes:
  postgres-data:
  redis-data:
