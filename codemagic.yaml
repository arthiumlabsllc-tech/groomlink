# Codemagic CI/CD Configuration for GroomLink iOS Builds
# ============================================================
# This config builds both the customer-app and partners-app for iOS
# and submits them to the Apple App Store via App Store Connect API.
#
# PREREQUISITES (set up in Codemagic dashboard):
# 1. App Store Connect integration named EXACTLY "GroomLink ASC"
#    (Issuer ID + Key ID + contents of AuthKey_XXXXXX.p8)
# 2. Code signing is AUTOMATIC: Codemagic fetches/creates the App Store
#    distribution certificate and provisioning profile for each bundle
#    identifier via the ASC integration. No manual certs required.
# 3. Environment variable groups (exact names, see below)
#
# REQUIRED ENVIRONMENT VARIABLE GROUP (set in Codemagic UI):
# - groomlink_credentials (mark as secure):
#     GOOGLE_MAPS_API_KEY, EXPO_PUBLIC_API_URL, EXPO_PUBLIC_WS_URL
#     (optional: EXPO_TOKEN from expo.dev if logging into Expo CLI)
# - groomlink_ios_signing: keep for future manual signing; not required
#   while automatic signing via the ASC integration is in use.
#
# APPLE APP IDs (from App Store Connect, already set in vars below):
# - Customer App: 6741658620 (bundle com.arthiumlabsllc.groomlink)
# - Partners App: 6778136462 (bundle com.arthiumlabsllc.partners)
# ============================================================

workflows:
  # ============================================================
  # CUSTOMER APP - iOS Production Build & Submit
  # ============================================================
  customer-app-ios:
    name: GroomLink Customer - iOS Production
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/customer-app
    
    integrations:
      app_store_connect: GroomLink ASC
    
    environment:
      node: 20.18.0
      xcode: latest
      cocoapods: default
      groups:
        - groomlink_credentials
        - groomlink_ios_signing
      vars:
        EXPO_NO_DOTENV: "1"
        # App Store Connect numeric App ID (GroomLink customer)
        IOS_APP_ID: "6741658620"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.arthiumlabsllc.groomlink
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    
    scripts:
      - name: Install dependencies
        script: |
          npm install
          
      - name: Set up Expo
        script: |
          npx expo install --check
          
      - name: Run Expo Prebuild (iOS)
        script: |
          npx expo prebuild --platform ios --clean
          
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          
      - name: Set up code signing
        script: |
          xcode-project use-profiles
          
      - name: Increment build number
        script: |
          cd ios
          LATEST_BUILD_NUMBER=$(app-store-connect fetch-latest-app-store-build-number "$IOS_APP_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
          
      - name: Build iOS app
        script: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "No xcworkspace found in ios/ — contents:"; ls -la; exit 1
          fi
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | sed -n '/Schemes:/,$p' | tail -n +2 | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            echo "No scheme found for $WORKSPACE:"; xcodebuild -workspace "$WORKSPACE" -list; exit 1
          fi
          echo "Building workspace: $WORKSPACE (scheme: $SCHEME)"
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME" \
            --config Release
    
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/build/Build/Products/*.app
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - manuelgoodegreen@icloud.com
        notify:
          success: true
          failure: true

