  # ============================================================
  # BOTH APPS - Build & Submit (manual trigger)
  # ============================================================
  all-ios-production:
    name: GroomLink All Apps - iOS Production
    max_build_duration: 90
    instance_type: mac_mini_m2
    
    integrations:
      app_store_connect: GroomLink ASC
    
    environment:
      node: 20.18.0
      xcode: latest
      cocoapods: default
      groups:
        - groomlink_credentials
        - groomlink_ios_signing
      vars:
        EXPO_NO_DOTENV: "1"
        ASC_APP_ID_CUSTOMER: "6741658620"
        ASC_APP_ID_PARTNERS: "6778136462"
      ios_signing:
        distribution_type: app_store
        bundle_identifier:
          - com.arthiumlabsllc.groomlink
          - com.arthiumlabsllc.partners
    
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    
    scripts:
      # --- Customer App ---
      - name: Build Customer App
        script: |
          cd apps/customer-app
          npm install
          npx expo prebuild --platform ios --clean
          xcode-project use-profiles
          cd ios
          LATEST_BUILD_NUMBER=$(app-store-connect fetch-latest-app-store-build-number "$ASC_APP_ID_CUSTOMER")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
          xcode-project build-ipa \
            --workspace "*.xcworkspace" \
            --scheme "groomlinkcustomer" \
            --config Release
          
      # --- Partners App ---
      - name: Build Partners App
        script: |
          cd apps/partners-app
          npm install
          npx expo prebuild --platform ios --clean
          xcode-project use-profiles
          cd ios
          LATEST_BUILD_NUMBER=$(app-store-connect fetch-latest-app-store-build-number "$ASC_APP_ID_PARTNERS")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
          xcode-project build-ipa \
            --workspace "*.xcworkspace" \
            --scheme "groomlinkpartners" \
            --config Release
    
    artifacts:
      - apps/customer-app/build/ios/ipa/*.ipa
      - apps/partners-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - hello@groomlinkgh.com
        notify:
          success: true
          failure: true
