# Codemagic CI/CD Configuration for GroomLink iOS Builds
# ============================================================
# This config builds both the customer-app and partners-app for iOS
# and submits them to the Apple App Store via App Store Connect API.
#
# PREREQUISITES (set up in Codemagic dashboard):
# 1. App Store Connect integration named EXACTLY "GroomLink ASC"
#    (Issuer ID + Key ID + contents of AuthKey_XXXXXX.p8)
# 2. Code signing is AUTOMATIC: Codemagic fetches/creates the App Store
#    distribution certificate and provisioning profile for each bundle
#    identifier via the ASC integration. No manual certs required.
# 3. Environment variable groups (exact names, see below)
#
# REQUIRED ENVIRONMENT VARIABLE GROUP (set in Codemagic UI):
# - groomlink_credentials (mark as secure):
#     GOOGLE_MAPS_API_KEY, EXPO_PUBLIC_API_URL, EXPO_PUBLIC_WS_URL
#     (optional: EXPO_TOKEN from expo.dev if logging into Expo CLI)
# - groomlink_ios_signing: keep for future manual signing; not required
#   while automatic signing via the ASC integration is in use.
#
# APPLE APP IDs (from App Store Connect, already set in vars below):
# - Customer App: 6741658620 (bundle com.arthiumlabsllc.groomlink)
# - Partners App: 6778136462 (bundle com.arthiumlabsllc.partners)
# ============================================================

workflows:
  # ============================================================
  # CUSTOMER APP - iOS Production Build & Submit
  # ============================================================
  customer-app-ios:
    name: GroomLink Customer - iOS Production
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/customer-app
    
    integrations:
      app_store_connect: GroomLink ASC
    
    environment:
      node: 20.18.0
      xcode: latest
      cocoapods: default
      groups:
        - groomlink_credentials
        - groomlink_ios_signing
      vars:
        EXPO_NO_DOTENV: "1"
        # App Store Connect numeric App ID (GroomLink customer)
        IOS_APP_ID: "6741658620"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.arthiumlabsllc.groomlink
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    
    scripts:
      - name: Install dependencies
        script: |
          npm install
          
      - name: Set up Expo
        script: |
          npx expo install --check
          
      - name: Run Expo Prebuild (iOS)
        script: |
          npx expo prebuild --platform ios --clean
          
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          
      - name: Set up code signing
        script: |
          xcode-project use-profiles
          
      - name: Increment build number
        script: |
          cd ios
          LATEST_BUILD_NUMBER=$(app-store-connect fetch-latest-app-store-build-number "$IOS_APP_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
          
      - name: Build iOS app
        script: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "No xcworkspace found in ios/ — contents:"; ls -la; exit 1
          fi
          # Expo prebuild names the scheme after the app display name (= workspace
          # basename). Never pick the first scheme in the list — that can be a
          # CocoaPods scheme like "boost".
          SCHEME="${WORKSPACE%.xcworkspace}"
          if ! xcodebuild -workspace "$WORKSPACE" -list | grep -qE "^[[:space:]]*$SCHEME[[:space:]]*$"; then
            echo "Scheme '$SCHEME' not found in:"; xcodebuild -workspace "$WORKSPACE" -list; exit 1
          fi
          BUNDLE_ID=$(xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -showBuildSettings 2>/dev/null \
            | grep -E '^[[:space:]]+PRODUCT_BUNDLE_IDENTIFIER = ' | head -1 \
            | sed -E 's/^[[:space:]]+PRODUCT_BUNDLE_IDENTIFIER = //' | tr -d ' ')
          if [ -z "$BUNDLE_ID" ]; then
            # Fallback: read it straight from the app project (skip Pods)
            PROJECT=$(ls -d *.xcodeproj 2>/dev/null | grep -v Pods | head -1)
            BUNDLE_ID=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER' "$PROJECT/project.pbxproj" 2>/dev/null \
              | sed -E 's/.*PRODUCT_BUNDLE_IDENTIFIER = "?([^";]+)"?;.*/\1/' | tr -d ' ')
          fi
          if [ -z "$BUNDLE_ID" ]; then
            echo "Could not determine PRODUCT_BUNDLE_IDENTIFIER"; exit 1
          fi
          echo "Workspace: $WORKSPACE | Scheme: $SCHEME | Bundle: $BUNDLE_ID"

          # Xcode 26 removed the "app-store" export method — generate our own
          # ExportOptions.plist with "app-store-connect" so exportArchive succeeds.
          TEAM_ID="4US64M3933"
          PROFILE_NAME=""
          for f in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            BID=$(security cms -D -i "$f" 2>/dev/null | plutil -extract Entitlements.application-identifier raw - 2>/dev/null)
            if [ "$BID" = "$TEAM_ID.$BUNDLE_ID" ]; then
              PROFILE_NAME=$(security cms -D -i "$f" | plutil -extract Name raw -)
            fi
          done
          if [ -z "$PROFILE_NAME" ]; then
            echo "No provisioning profile found for bundle $BUNDLE_ID"; exit 1
          fi

          # Build the plist programmatically — always valid, self-verified by lint
          rm -f export_options.plist
          plutil -create xml1 export_options.plist
          plutil -insert method -string "app-store-connect" export_options.plist
          plutil -insert destination -string "export" export_options.plist
          plutil -insert teamID -string "$TEAM_ID" export_options.plist
          plutil -insert signingCertificate -string "Apple Distribution" export_options.plist
          plutil -insert signingStyle -string "manual" export_options.plist
          plutil -insert provisioningProfiles -xml "<dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>" export_options.plist
          plutil -lint export_options.plist
          echo "--- export_options.plist ---"
          plutil -p export_options.plist

          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME" \
            --config Release \
            --export-options-plist export_options.plist
    
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/build/Build/Products/*.app
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - manuelgoodegreen@icloud.com
        notify:
          success: true
          failure: true

