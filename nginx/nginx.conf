events {
    worker_connections 1024;
}

http {
    # Block sensitive files globally

    # Complete Security Headers
    add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://groomlinkgh.com https://*.groomlinkgh.com https://maps.googleapis.com https://nominatim.openstreetmap.org wss://groomlinkgh.com wss://*.groomlinkgh.com; frame-src 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://groomlinkgh.com https://*.groomlinkgh.com https://maps.googleapis.com https://nominatim.openstreetmap.org wss://groomlinkgh.com wss://*.groomlinkgh.com; frame-src 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

    map $uri $block_sensitive {
        default 0;
        ~*\.env$ 1;
        ~*\.git(/|$) 1;
        ~*\.(git|svn|env|htaccess|htpasswd|DS_Store)$ 1;
        ~*^/(config|configuration|backup|db|database|tmp|temp) 1;
    }


    server_tokens off;
    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Max upload size for file uploads (avatars, images)
    client_max_body_size 10m;

    # Rate limiting - Increased to handle dashboard loading multiple simultaneous requests
    limit_req_zone $binary_remote_addr zone=api:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

    # Upstream servers
    upstream api_backend {
        server groomlink-api:3000;
    }

    upstream admin_backend {
        server groomlink-admin:80;
    }

    upstream landing_backend {
        server groomlink-landing:80;
    }

    upstream partners_backend {
        server groomlink-partners:80;
    }

    upstream support_backend {
        server groomlink-support:80;
    }

    upstream customer_backend {
        server groomlink-customer:80;
    }

    # Main domain - Landing page (HTTP)
    server {
        listen 80;
        
        # Block sensitive files
        if ($block_sensitive) {
            return 404;
        }

server_name groomlinkgh.com www.groomlinkgh.com;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        return 301 https://groomlinkgh.com$request_uri;
    }

    # Main domain - Landing page (HTTPS)
    server {
        listen 443 ssl http2;
        
        # Block sensitive files
        if ($block_sensitive) {
            return 404;
        }

server_name groomlinkgh.com www.groomlinkgh.com;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/groomlinkgh.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/groomlinkgh.com/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://groomlinkgh.com https://*.groomlinkgh.com https://maps.googleapis.com https://nominatim.openstreetmap.org wss://groomlinkgh.com wss://*.groomlinkgh.com; frame-src 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;


        # Allow search engine indexing for main site
        # Serve robots.txt that allows crawling for the public landing page
        location = /robots.txt {
            return 200 'User-agent: *
Allow: /
Disallow: /api/

Sitemap: https://groomlinkgh.com/sitemap.xml
';
            add_header Content-Type text/plain;
        }

        # API endpoints - MUST come BEFORE location /
        location /api {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Payment callback redirect
        # After Paystack payment, backend redirects to /payment/callback on the main domain
        # We redirect to the customer web app so it can show the payment result
        location /payment/callback {
            return 301 https://my.groomlinkgh.com$request_uri;
        }

        # Socket.IO WebSocket support
        location /socket.io {
            proxy_pass http://api_backend/socket.io;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Serve landing page
        location / {
            proxy_pass http://landing_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Admin subdomain (HTTP)
    server {
        listen 80;
        
        # Block sensitive files
        if ($block_sensitive) {
            return 404;
        }

server_name dash.groomlinkgh.com;
        
        location /.well-known/acme-challenge/ {
