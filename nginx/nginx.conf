events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Upstream servers
    upstream api_backend {
        server 172.17.0.1:3000;
    }

    upstream admin_backend {
        server 172.17.0.1:8080;
    }

    upstream landing_backend {
        server 172.17.0.1:8081;
    }

    upstream partners_backend {
        server 172.17.0.1:8082;
    }

    upstream support_backend {
        server 172.17.0.1:8083;
    }

    # Main domain - Landing page (HTTP)
    server {
        listen 80;
        server_name groomlinkgh.com www.groomlinkgh.com;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        return 301 https://groomlinkgh.com$request_uri;
    }

    # Main domain - Landing page (HTTPS)
    server {
        listen 443 ssl http2;
        server_name groomlinkgh.com www.groomlinkgh.com;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/groomlinkgh.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/groomlinkgh.com/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;

        # API endpoints - MUST come BEFORE location /
        location /api {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Serve landing page
        location / {
            proxy_pass http://landing_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Admin subdomain (HTTP)
    server {
        listen 80;
        server_name dash.groomlinkgh.com;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        return 301 https://dash.groomlinkgh.com$request_uri;
    }

    # Admin subdomain (HTTPS)
    server {
        listen 443 ssl http2;
