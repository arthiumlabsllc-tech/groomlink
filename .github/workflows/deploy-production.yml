name: CI (Production)

# Deploys are fully automated outside GitHub Actions:
#   - API (services/api)  -> Render auto-deploys from `main` (see render.yaml)
#   - Web frontends       -> Vercel auto-deploys from `main` (see apps/*/vercel.json)
# This workflow runs the test suite on every push to main and smoke-tests
# the live API after Render finishes deploying.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd services/api
        npm ci

    - name: Run tests
      run: |
        cd services/api
        npm test

    - name: Type check
      run: |
        cd services/api
        npm run typecheck

  health-check:
    needs: test
    runs-on: ubuntu-latest
    # Give Render time to finish its auto-deploy before smoke-testing.
    steps:
    - name: Wait for Render deploy
      run: sleep 180

    - name: Smoke-test live API
      run: |
        curl -sf --max-time 30 https://api.groomlinkgh.com/api/health || exit 1
        echo "API healthy after deploy!"
