name: CI (Beta / develop)

# The old beta VPS was retired with the move to free hosting.
# `develop` now only runs CI; production deploys flow from `main`
# via Render (API) and Vercel (frontends).

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        cd services/api
        npm ci

    - name: Run tests
      run: |
        cd services/api
        npm test

    - name: Type check
      run: |
        cd services/api
        npm run typecheck
