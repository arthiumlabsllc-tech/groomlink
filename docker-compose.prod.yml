version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: groomlink-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-groomlink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-groomlink123}
      POSTGRES_DB: ${DB_NAME:-groomlink}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-groomlink} -d ${DB_NAME:-groomlink}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - groomlink-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: groomlink-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - groomlink-network

  # Backend API
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: groomlink-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-groomlink}:${DB_PASSWORD:-groomlink123}@postgres:5432/${DB_NAME:-groomlink}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      DB_CONNECTION_POOL_SIZE: ${DB_CONNECTION_POOL_SIZE:-20}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-10000}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-30000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - groomlink-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Admin Dashboard (Static files served via nginx)
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: groomlink-admin
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - groomlink-network

  # Landing Page
  landing:
    build:
      context: ./apps/landing
      dockerfile: Dockerfile
    container_name: groomlink-landing
    restart: always
    ports:
      - "8081:80"
    networks:
      - groomlink-network

  # Partners Dashboard (Salon Owners)
  partners:
    build:
      context: ./apps/partners
      dockerfile: Dockerfile
    container_name: groomlink-partners
    restart: always
    ports:
      - "8082:80"
    networks:
      - groomlink-network

  # Support Dashboard
  support:
    build:
      context: ./apps/support
      dockerfile: Dockerfile
    container_name: groomlink-support
    restart: always
    ports:
      - "8083:80"
    networks:
      - groomlink-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: groomlink-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - admin
    networks:
      - groomlink-network

volumes:
  postgres-data:
  redis-data:

networks:
  groomlink-network:
    driver: bridge
