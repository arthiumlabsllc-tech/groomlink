version: '3.8'

services:
  # PostgreSQL Database - NOT exposed to internet
  postgres:
    image: postgres:15-alpine
    container_name: groomlink-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-groomlink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-groomlink123}
      POSTGRES_DB: ${DB_NAME:-groomlink}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # REMOVED: ports - Database should NOT be accessible from internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-groomlink} -d ${DB_NAME:-groomlink}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - groomlink-network

  # Redis Cache - NOT exposed to internet
  redis:
    image: redis:7-alpine
    container_name: groomlink-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    # REMOVED: ports - Redis should NOT be accessible from internet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - groomlink-network

  # Backend API - Only accessible via Nginx reverse proxy
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: groomlink-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Africa/Accra
      DATABASE_URL: postgresql://${DB_USER:-groomlink}:${DB_PASSWORD:-groomlink123}@postgres:5432/${DB_NAME:-groomlink}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      DB_CONNECTION_POOL_SIZE: ${DB_CONNECTION_POOL_SIZE:-20}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-10000}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-30000}
      # Africa's Talking SMS
      AT_USERNAME: ${AT_USERNAME}
      AT_API_KEY: ${AT_API_KEY}
      SMS_FROM: ${SMS_FROM}
      # SMTP Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      # Hubtel Payment
      HUBTEL_API_ID: ${HUBTEL_API_ID}
      HUBTEL_API_SECRET: ${HUBTEL_API_SECRET}
      HUBTEL_MERCHANT_ACCOUNT_ID: ${HUBTEL_MERCHANT_ACCOUNT_ID}
      HUBTEL_PAYMENT_WEBHOOK_URL: ${HUBTEL_PAYMENT_WEBHOOK_URL:-https://groomlinkgh.com/api/payments/webhook/hubtel}
      # Paystack Payment Gateway
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-https://groomlinkgh.com/api/payments/callback/paystack}
    # REMOVED: ports - API should only be accessible via Nginx
    expose:
      - "3000"  # Expose to Nginx only, not to internet
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - groomlink-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Admin Dashboard (Static files served via nginx) - NOT directly exposed
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://groomlinkgh.com/api}
    container_name: groomlink-admin
    restart: always
    # REMOVED: ports - Only accessible via Nginx reverse proxy
    expose:
      - "80"  # Expose to Nginx only
    depends_on:
      - api
    networks:
      - groomlink-network

  # Landing Page - Only accessible via Nginx
  landing:
    build:
      context: ./apps/landing
      dockerfile: Dockerfile
    container_name: groomlink-landing
    restart: always
    # REMOVED: ports - Only accessible via Nginx reverse proxy
    expose:
      - "80"  # Expose to Nginx only
    networks:
      - groomlink-network

  # Partners Dashboard (Salon Owners) - Only accessible via Nginx
  partners:
    build:
      context: ./apps/partners
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://groomlinkgh.com/api}
    container_name: groomlink-partners
    restart: always
    # REMOVED: ports - Only accessible via Nginx reverse proxy
    expose:
      - "80"  # Expose to Nginx only
    networks:
      - groomlink-network

  # Support Dashboard - Only accessible via Nginx
  support:
    build:
      context: ./apps/support
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://groomlinkgh.com/api}
    container_name: groomlink-support
    restart: always
    # REMOVED: ports - Only accessible via Nginx reverse proxy
    expose:
      - "80"  # Expose to Nginx only
    networks:
      - groomlink-network

  # Customer Dashboard (Web App) - Only accessible via Nginx
  customer:
    build:
      context: ./apps/customer
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://groomlinkgh.com/api}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    container_name: groomlink-customer
    restart: always
    # REMOVED: ports - Only accessible via Nginx reverse proxy
    expose:
      - "80"  # Expose to Nginx only
    networks:
      - groomlink-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: groomlink-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - admin
    networks:
      - groomlink-network

volumes:
  postgres-data:
  redis-data:

networks:
  groomlink-network:
    driver: bridge
