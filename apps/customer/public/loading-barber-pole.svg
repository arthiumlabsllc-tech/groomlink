<svg xmlns="http://www.w3.org/2000/svg" width="140" height="14" viewBox="0 0 140 14">
  <!-- Animated barber-pole loading bar (Ghana brand stripes) -->
  <defs>
    <clipPath id="pole">
      <rect width="140" height="14" rx="7"/>
    </clipPath>
  </defs>
  <g clip-path="url(#pole)">
    <g transform="skewX(-20)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="-30 0" to="0 0" dur="0.9s" repeatCount="indefinite"/>
        <rect x="-60" width="10" height="14" fill="#CE1126"/>
        <rect x="-50" width="10" height="14" fill="#FCD116"/>
        <rect x="-40" width="10" height="14" fill="#006B3F"/>
        <rect x="-30" width="10" height="14" fill="#CE1126"/>
        <rect x="-20" width="10" height="14" fill="#FCD116"/>
        <rect x="-10" width="10" height="14" fill="#006B3F"/>
        <rect x="0" width="10" height="14" fill="#CE1126"/>
        <rect x="10" width="10" height="14" fill="#FCD116"/>
        <rect x="20" width="10" height="14" fill="#006B3F"/>
        <rect x="30" width="10" height="14" fill="#CE1126"/>
        <rect x="40" width="10" height="14" fill="#FCD116"/>
        <rect x="50" width="10" height="14" fill="#006B3F"/>
        <rect x="60" width="10" height="14" fill="#CE1126"/>
        <rect x="70" width="10" height="14" fill="#FCD116"/>
        <rect x="80" width="10" height="14" fill="#006B3F"/>
        <rect x="90" width="10" height="14" fill="#CE1126"/>
        <rect x="100" width="10" height="14" fill="#FCD116"/>
        <rect x="110" width="10" height="14" fill="#006B3F"/>
        <rect x="120" width="10" height="14" fill="#CE1126"/>
        <rect x="130" width="10" height="14" fill="#FCD116"/>
        <rect x="140" width="10" height="14" fill="#006B3F"/>
        <rect x="150" width="10" height="14" fill="#CE1126"/>
        <rect x="160" width="10" height="14" fill="#FCD116"/>
        <rect x="170" width="10" height="14" fill="#006B3F"/>
        <rect x="180" width="10" height="14" fill="#CE1126"/>
        <rect x="190" width="10" height="14" fill="#FCD116"/>
        <rect x="200" width="10" height="14" fill="#006B3F"/>
      </g>
    </g>
  </g>
</svg>
