<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-black.png" />
    <link rel="apple-touch-icon" href="/logo-black.png" />
    <meta name="msapplication-TileImage" content="/logo-black.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>GroomLink - My Bookings</title>
    <meta name="description" content="Manage your GroomLink bookings, discover salons, and track your grooming history." />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body>
    <div id="app-loader">
      <img src="/logo-black.png" alt="" class="loader-mark loader-mark-light" />
      <img src="/logo-white.png" alt="" class="loader-mark loader-mark-dark" />
      <div class="loader-content">
        <img src="/logo-full-black.png" alt="GroomLink" class="loader-logo loader-logo-light" />
        <img src="/logo-full-white.png" alt="GroomLink" class="loader-logo loader-logo-dark" />
        <img src="/loading-barber-pole.svg" alt="" class="loader-bar" />
      </div>
    </div>
    <style>
      #app-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, rgba(0, 107, 63, 0.05) 0%, #ffffff 50%, rgba(252, 209, 22, 0.1) 100%);
      }
      #app-loader .loader-mark {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 320px;
        height: 320px;
        object-fit: contain;
        opacity: 0.06;
        pointer-events: none;
        user-select: none;
      }
      #app-loader .loader-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }
      #app-loader .loader-logo {
        height: 56px;
        width: auto;
      }
      #app-loader .loader-bar {
        height: 14px;
        width: auto;
      }
      .loader-mark-dark,
      .loader-logo-dark {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        #app-loader {
          background: linear-gradient(135deg, rgba(0, 107, 63, 0.16) 0%, #0f1419 50%, rgba(252, 209, 22, 0.07) 100%);
        }
        #app-loader .loader-mark {
          opacity: 0.07;
        }
        .loader-mark-light,
        .loader-logo-light {
          display: none;
        }
        .loader-mark-dark,
        .loader-logo-dark {
          display: block;
        }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
