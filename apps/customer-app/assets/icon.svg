<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#CE1126"/>
  
  <!-- Scissors Icon -->
  <g transform="translate(512, 512)">
    <!-- Top scissor blade -->
    <path d="M-120 -200 L-80 -80 L80 -80 L120 -200" 
          fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom scissor blade -->
    <path d="M-120 200 L-80 80 L80 80 L120 200" 
          fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center pivot circle -->
    <circle cx="0" cy="0" r="40" fill="white"/>
    
    <!-- Handle circles -->
    <circle cx="-160" cy="-260" r="60" fill="none" stroke="white" stroke-width="20"/>
    <circle cx="-160" cy="260" r="60" fill="none" stroke="white" stroke-width="20"/>
    
    <!-- Connecting lines -->
    <line x1="-100" y1="-200" x2="-160" y2="-200" stroke="white" stroke-width="24" stroke-linecap="round"/>
    <line x1="-100" y1="200" x2="-160" y2="200" stroke="white" stroke-width="24" stroke-linecap="round"/>
  </g>
  
  <!-- App name -->
  <text x="512" y="900" text-anchor="middle" fill="white" font-size="72" font-weight="bold" font-family="Arial, sans-serif">GroomLink</text>
</svg>
