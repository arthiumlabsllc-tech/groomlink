<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-black.png" />
    <link rel="apple-touch-icon" href="/logo-black.png" />
    <meta name="msapplication-TileImage" content="/logo-black.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="GroomLink - Ghana's Premier Beauty & Grooming Booking Platform. Book appointments with top salons, barbershops, and beauty professionals across Ghana." />
    <meta name="keywords" content="salon booking Ghana, barbershop Accra, beauty services Ghana, grooming appointments, hair salon booking" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>GroomLink - Ghana's Premier Beauty & Grooming Platform</title>
  </head>
  <body>
    <div id="app-loader">
      <div class="loader-content">
        <img src="/loading-salon-02.webp" alt="GroomLink" class="loader-illustration" />
        <div class="loader-dots">
          <span class="loader-dot" style="animation-delay:0s"></span>
          <span class="loader-dot" style="animation-delay:0.15s"></span>
          <span class="loader-dot" style="animation-delay:0.3s"></span>
        </div>
        <span class="loader-text">GroomLink</span>
      </div>
    </div>
    <style>
      #app-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #fff;
        position: relative;
        overflow: hidden;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        position: relative;
        z-index: 1;
      }
      .loader-illustration {
        width: 240px;
        height: 240px;
        object-fit: contain;
        animation: loader-fade-in 0.6s ease-out;
      }
      @media (min-width: 768px) {
        .loader-illustration {
          width: 300px;
          height: 300px;
        }
      }
      .loader-dots {
        display: flex;
        gap: 8px;
      }
      .loader-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #CE1126;
        animation: loader-bounce 1.2s ease-in-out infinite;
      }
      .loader-text {
        font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: #006B3F;
        letter-spacing: 1px;
      }
      @keyframes loader-fade-in {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes loader-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40% { transform: translateY(-8px); opacity: 1; }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
